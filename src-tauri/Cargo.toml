[package]
name = "stamina-timer"
version = "0.3.0"
description = "游戏体力恢复计时器 — 基于时间戳的被动式多游戏体力追踪"
edition = "2021"

[lib]
name = "stamina_timer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

# AUMID 三件套（项1 通知归属/去重/设置管理）：用 windows crate 标准 COM API，
# 严禁使用被投毒占用的 windows-shortcuts crate。版本与 Tauri 内部锁定的 0.61 对齐。
#
# ⚠️ 必须放在 [target.'cfg(windows)'.dependencies]，绝不能放进上面的 [dependencies]：
#    windows 作为无条件依赖时，cargo 会在 Linux（CI 的 ubuntu-latest）上也构建它及其依赖链，
#    其中 windows-future v0.2.1 引用了 windows_core::imp::IMarshal 与 imp::marshaler ——
#    这两个是 windows-core 仅在 Windows 目标提供的内部符号，在 Linux 上必然 E0425 编译失败。
#    （本地 `cargo check --target x86_64-pc-windows-msvc` 走 Windows 目标，命中符号，永远测不出此问题）
#    AUMID 代码本身即 #[cfg(windows)] 门控，非 Windows 平台本就不需要该依赖。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Variant",
] }
