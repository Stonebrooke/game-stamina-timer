name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Read version from tauri.conf.json
        id: ver
        working-directory: ./src-tauri
        run: |
          V=$(grep '"version"' tauri.conf.json | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved tauri.conf.json version: $V"

      - name: Verify tag version matches tauri.conf.json
        working-directory: ./src-tauri
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          CONF_VER="${{ steps.ver.outputs.version }}"
          if [ "$TAG_VER" != "$CONF_VER" ]; then
            echo "::error::Tag version ($TAG_VER) != tauri.conf.json version ($CONF_VER)"
            exit 1
          fi
          echo "Version OK: tag=$TAG_VER conf=$CONF_VER"

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '游戏体力计时器 ${{ github.ref_name }}'
          releaseBody: |
            下载 Windows 安装包（NSIS）：
            - `游戏体力计时器_${{ steps.ver.outputs.version }}_x64-setup.exe`
            双击安装即可，会自动覆盖旧版本。
          releaseDraft: false
          prerelease: false
